<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Carros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Gestión de Carros</h2>
    <a th:href="@{/carros/nuevo}" class="btn btn-primary mb-3">Agregar Nuevo Carro</a>
    
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Placa</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Chofer Asignado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Iteración de datos con Thymeleaf -->
            <tr th:each="carro : ${carros}">
                <td th:text="${carro.id}"></td>
                <td th:text="${carro.placa}"></td>
                <td th:text="${carro.marca}"></td>
                <td th:text="${carro.modelo}"></td>
                <td th:text="${carro.chofer != null ? carro.chofer.nombre : 'Sin asignar'}"></td>
                <td>
                    <a th:href="@{/carros/editar/{id}(id=${carro.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/carros/eliminar/{id}(id=${carro.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
