<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Chofer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 th:text="${chofer.id == null ? 'Nuevo Chofer' : 'Editar Chofer'}"></h2>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    
    <form th:action="@{/choferes/guardar}" th:object="${chofer}" method="post" class="mt-4">
        <input type="hidden" th:field="*{id}" />
        
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required />
        </div>
        
        <div class="mb-3">
            <label class="form-label">Licencia</label>
            <input type="text" th:field="*{licencia}" class="form-control" required />
        </div>
        
        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" th:field="*{telefono}" class="form-control" required />
        </div>
        
        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/choferes}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
