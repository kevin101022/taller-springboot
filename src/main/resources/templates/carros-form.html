<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Carro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 th:text="${carro.id == null ? 'Nuevo Carro' : 'Editar Carro'}"></h2>
    
    <!-- Enlace al controlador con Thymeleaf -->
    <form th:action="@{/carros/guardar}" th:object="${carro}" method="post" class="mt-4">
        <input type="hidden" th:field="*{id}" />
        
        <div class="mb-3">
            <label class="form-label">Placa</label>
            <input type="text" th:field="*{placa}" class="form-control" required />
        </div>
        
        <div class="mb-3">
            <label class="form-label">Marca</label>
            <input type="text" th:field="*{marca}" class="form-control" required />
        </div>
        
        <div class="mb-3">
            <label class="form-label">Modelo</label>
            <input type="text" th:field="*{modelo}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Chofer Asignado</label>
            <select th:field="*{chofer}" class="form-select">
                <option value="">Seleccione un chofer (Opcional)</option>
                <option th:each="chofer : ${choferes}" 
                        th:value="${chofer.id}" 
                        th:text="${chofer.nombre}"></option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/carros}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
