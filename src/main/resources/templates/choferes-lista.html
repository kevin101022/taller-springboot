<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Choferes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Gestión de Choferes</h2>
    <a th:href="@{/choferes/nuevo}" class="btn btn-primary mb-3">Agregar Nuevo Chofer</a>
    
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Licencia</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="chofer : ${choferes}">
                <td th:text="${chofer.id}"></td>
                <td th:text="${chofer.nombre}"></td>
                <td th:text="${chofer.licencia}"></td>
                <td th:text="${chofer.telefono}"></td>
                <td>
                    <a th:href="@{/choferes/editar/{id}(id=${chofer.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/choferes/eliminar/{id}(id=${chofer.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/}" class="btn btn-secondary mt-3">Volver al Inicio</a>
</div>
</body>
</html>
